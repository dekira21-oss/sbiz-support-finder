name: 기업마당 공고 매일 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시
  workflow_dispatch:        # Actions 탭에서 직접 실행
  push:                     # 수집 스크립트나 이 설정을 고치면 바로 한 번 실행
    branches: [main]
    paths:
      - scripts/fetch-notices.mjs
      - .github/workflows/update-notices.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 키 등록 위치 점검(값은 출력하지 않음)
        run: |
          echo "::notice::Repository secret BIZINFO_KEY 있음=${{ secrets.BIZINFO_KEY != '' }} / Variables BIZINFO_KEY 있음=${{ vars.BIZINFO_KEY != '' }}"
      - name: 공고 받아오기
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: node scripts/fetch-notices.mjs
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/notices.json
            git commit -m "기업마당 공고 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          else
            echo "바뀐 공고 없음"
          fi
